plugins { id 'com.android.application' }
android {
    namespace 'dev.aihuanxi.flowbot'
    compileSdk 36
    buildFeatures { buildConfig true }
    // Dedicated sideloaded test app; Google Play publication is outside this MVP.
    lint { disable 'ExpiredTargetSdkVersion' }
    defaultConfig {
        applicationId 'dev.aihuanxi.flowbot'
        minSdk 30
        targetSdk 32
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
