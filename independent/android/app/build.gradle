plugins { id 'com.android.application' }
android {
    namespace 'dev.aihuanxi.flowbot'
    compileSdk 36
    buildFeatures { buildConfig true }
    // Dedicated sideloaded test app; Google Play publication is outside this MVP.
    lint { disable 'ExpiredTargetSdkVersion' }
    defaultConfig {
        applicationId 'dev.aihuanxi.flowbot'
        minSdk 30
        targetSdk 32
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (System.getenv('FLOWBOT_KEYSTORE')) {
        signingConfigs {
            owned {
                storeFile file(System.getenv('FLOWBOT_KEYSTORE'))
                storePassword System.getenv('FLOWBOT_STORE_PASSWORD')
                keyAlias System.getenv('FLOWBOT_KEY_ALIAS')
                keyPassword System.getenv('FLOWBOT_KEY_PASSWORD')
            }
        }
        buildTypes.release.signingConfig signingConfigs.owned
    }
}
